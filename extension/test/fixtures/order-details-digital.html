<!DOCTYPE html>
<html lang="en-us">
<head><title>Order Details</title></head>
<body>
<!-- Made-up digital order, in the shape of Amazon's order details page. -->
<div id="orderDetails">

  <div data-component="purchasedItems">
    <div class="a-fixed-left-grid"><div class="a-fixed-left-grid-inner">
      <div class="a-fixed-left-grid-col a-col-left"><a href="/dp/B000000005"><img alt="The Example Novel" src="x.jpg" /></a></div>
      <div class="a-fixed-left-grid-col a-col-right">
        <div data-component="itemTitle"><a class="a-link-normal" href="/dp/B000000005">The Example Novel (Kindle Edition)</a></div>
      </div>
    </div></div>
  </div>
  <div class="recommendations">
    <a href="/dp/B000000099">Something Amazon recommends</a>
  </div>
</div>
</body>
</html>
