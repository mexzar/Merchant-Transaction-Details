[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marchant-transaction-details"
version = "0.1.0"
description = "Download order and transaction details from well-known merchants (starting with Amazon) and optionally push them to a configurable web endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Zarzar", email = "daniel.zarzar@gmail.com" }]
keywords = ["amazon", "orders", "transactions", "scraper", "receipts"]

dependencies = [
    # Amazon order/transaction scraping (chosen library — see notepad/).
    "amazon-orders>=4.3.0,<5.0.0",
    # Local web UI.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Config / data models.
    "pydantic>=2.6",
    "platformdirs>=4.0",
    # Phase 2: pushing to a web endpoint.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
marchant = "marchant.__main__:main"

[project.urls]
Homepage = "https://github.com/mexzar/marchant-transaction-details"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marchant = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
