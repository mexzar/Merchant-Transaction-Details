[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-transaction-details"
version = "0.1.0"
description = "Download order and transaction details from well-known merchants (starting with Amazon) into a tidy local JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Zarzar", email = "daniel.zarzar@gmail.com" }]
keywords = ["amazon", "orders", "transactions", "scraper", "receipts"]

dependencies = [
    # Amazon order/transaction scraping (chosen library — see notepad/).
    # The [browser] extra pulls in Playwright; we need it for Amazon's JS auth
    # challenge. Chromium itself is downloaded on first run via __main__.
    "amazon-orders[browser]>=4.3.0,<5.0.0",
    # Local web UI.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Config / data models.
    "pydantic>=2.6",
    "platformdirs>=4.0",
    # Secure, cross-platform credential storage (macOS Keychain, Windows
    # Credential Manager, Linux Secret Service).
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
merchant = "merchant.__main__:main"

[project.urls]
Homepage = "https://github.com/mexzar/merchant-transaction-details"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merchant = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
